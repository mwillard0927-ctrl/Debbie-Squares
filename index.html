<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Debbie's Squares</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#000000"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Debbie's Squares">
<link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root{--bg:#f4f4f2;--card:#fff;--ink:#1a1a1a;--mute:#6b6b6b;--line:#1a1a1a;--cur:#fff8cc;--live:#c62828;--accent:#1b7f3b;--gray:#e9e9e6}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--card:#1e1e1e;--ink:#eee;--mute:#9a9a9a;--line:#555;--cur:#3a3518;--gray:#2a2a2a;color-scheme:dark}}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,system-ui,sans-serif;font-size:14px;margin:0;padding:12px 16px 40px}
header{background:#000;text-align:center;padding:14px 8px;border-radius:8px 8px 0 0;overflow:hidden}
.ttl{font-family:'Bungee',Impact,sans-serif;font-size:28px;letter-spacing:1px;display:inline-block}
.ttl span{display:inline-block;background:linear-gradient(90deg,#ffd54a,#ff6b35,#ff2d95,#7c4dff,#00e5ff,#ffd54a);background-size:400% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 6s linear infinite,bob 2.4s ease-in-out infinite;filter:drop-shadow(0 0 6px rgba(255,120,60,.45))}
@keyframes shim{to{background-position:400% 0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@media (prefers-reduced-motion:reduce){.ttl span{animation:none}}
.grid{display:grid;grid-template-columns:repeat(3,1fr);border:2px solid var(--line);border-top:none;background:var(--card)}
.wk{border:1px solid var(--line);padding:8px 6px;text-align:center;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;min-width:0}
.wk.cur{background:var(--cur)}
.wk h3{margin:0 0 4px;font-size:13px}
.tg{display:inline-grid;grid-template-columns:auto auto;column-gap:8px;row-gap:3px;font-size:12px;text-align:left;max-width:100%}
.tg .n{white-space:nowrap}
.tg .s{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.st{font-size:9px;color:var(--mute);font-weight:400}
.st.live{color:var(--live);font-weight:700}
.tot{border-top:1px solid var(--line);margin-top:4px;padding-top:3px;font-weight:700;font-size:13px}
.tot.proj{color:var(--mute);font-weight:600}
.hl{font-size:10px;margin-top:3px;color:var(--mute)}
.hl .h{color:var(--accent);font-weight:700}.hl .l{color:#1565c0;font-weight:700}
.hint{font-size:11px;color:var(--mute);text-align:center;margin:8px 0}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px}
#modal .box{background:var(--card);border-radius:12px;padding:18px;width:100%;max-width:320px}
#modal input{width:100%;box-sizing:border-box;font-size:20px;padding:8px;margin:10px 0;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
#modal button{font-size:15px;padding:8px 14px;border-radius:8px;border:none;margin-left:6px}
.btns{text-align:right}.ok{background:var(--accent);color:#fff}.cx{background:var(--gray);color:var(--ink)}
@media (max-width:400px){.tg{font-size:10.5px;column-gap:5px}.wk{padding:6px 3px}}
</style></head><body>
<header><span class="ttl" id="ttl">Debbie's Squares</span></header>
<div class="grid" id="grid"></div>
<p class="hint" id="hint">Hold a finished week's square to enter the winning high &amp; low scores.</p>
<p class="hint" id="upd"></p>
<div id="modal"><div class="box"><div id="mtitle" style="font-weight:700"></div><input id="minp" type="number" inputmode="numeric"><div class="btns"><button class="cx" id="mcx">Skip</button><button class="ok" id="mok">Save</button></div></div></div>
<script>
// SNAPSHOT (updated weekly by the scheduled task) — keep on one line
const SNAP={"w1":{"IND":{"score":23,"state":"post"},"LV":{"score":27,"state":"post"},"MIN":{"score":39,"state":"post"}},"w2":{"HOU":{"score":6,"state":"post"},"MIA":{"score":13,"state":"post"},"PHI":{"score":24,"state":"post"}},"w3":{"JAX":{"score":35,"state":"post"},"NO":{"score":27,"state":"post"},"SEA":{"score":31,"state":"post"}},"w4":{"KC":{"score":30,"state":"post"},"LAR":{"score":24,"state":"post"},"NE":{"score":29,"state":"post"}},"w5":{"DET":{"score":45,"state":"post"},"SF":{"score":32,"state":"post"},"TB":{"score":24,"state":"post"}},"w6":{"GB":{"score":23,"state":"post"},"NYJ":{"score":19,"state":"post"},"TEN":{"score":26,"state":"post"}},"w7":{"DAL":{"score":38,"state":"post"},"LAC":{"bye":true},"WSH":{"bye":true}},"w8":{"CIN":{"score":43,"state":"post"},"DEN":{"score":28,"state":"post"},"PIT":{"score":27,"state":"post"}},"w9":{"BUF":{"score":23,"state":"post"},"CHI":{"score":27,"state":"post"},"NYG":{"score":19,"state":"post"}},"w10":{"BAL":{"score":20,"state":"post"},"CLE":{"score":27,"state":"post"},"NYJ":{"score":12,"state":"post"}},"w11":{"ARI":{"score":7,"state":"post"},"ATL":{"bye":true},"CAR":{"score":35,"state":"post"}},"w12":{"BAL":{"proj":20,"score":0,"state":"pre"},"GB":{"proj":21,"score":0,"state":"pre"},"SF":{"proj":25,"score":0,"state":"pre"}},"w13":{"HOU":{"proj":22,"score":0,"state":"pre"},"TB":{"proj":22,"score":0,"state":"pre"},"WSH":{"proj":24,"score":0,"state":"pre"}},"w14":{"IND":{"proj":21,"score":0,"state":"pre"},"NO":{"proj":21,"score":0,"state":"pre"},"NYG":{"proj":19,"score":0,"state":"pre"}}};
const W=[["Sep 9 - 14",["IND","LV","MIN"]],["Sep 17 - 21",["HOU","MIA","PHI"]],["Sep 24 - 28",["JAX","NO","SEA"]],["Oct 1 - 5",["KC","LAR","NE"]],["Oct 8 - 12",["DET","SF","TB"]],["Oct 15 - 19",["GB","NYJ","TEN"]],["Oct 22 - 26",["DAL","LAC","WSH"]],["Oct 29 - Nov 2",["CIN","DEN","PIT"]],["Nov 5 - 9",["BUF","CHI","NYG"]],["Nov 12 - 16",["BAL","CLE","NYJ"]],["Nov 19 - 23",["ARI","ATL","CAR"]],["Nov 26 - 30",["BAL","GB","SF"]],["Dec 3 - 7",["HOU","TB","WSH"]],["Dec 10 - 14",["IND","NO","NYG"]],["Dec 17 - 21",["JAX","MIA","SEA"]],["Dec 24 - 28",["KC","NE","PHI"]],["Dec 31 - Jan 4",["LV","MIN","PIT"]],["Jan 7 - 10",["BUF","HOU","NO"]]];
const N={IND:"Indianapolis",LV:"Las Vegas",MIN:"Minnesota",HOU:"Houston",MIA:"Miami",PHI:"Philadelphia",JAX:"Jacksonville",NO:"New Orleans",SEA:"Seattle",KC:"Kansas City",LAR:"LA Rams",NE:"New England",DET:"Detroit",SF:"San Francisco",TB:"Tampa Bay",GB:"Green Bay",NYJ:"NY Jets",TEN:"Tennessee",DAL:"Dallas",LAC:"LA Chargers",WSH:"Washington",CIN:"Cincinnati",DEN:"Denver",PIT:"Pittsburgh",BUF:"Buffalo",CHI:"Chicago",NYG:"NY Giants",BAL:"Baltimore",CLE:"Cleveland",ARI:"Arizona",ATL:"Atlanta",CAR:"Carolina"};
const MO={Sep:8,Oct:9,Nov:10,Dec:11,Jan:0};
function rng(lbl){const p=lbl.split(" - ");const[a,b]=p[0].split(" ");const s=new Date(MO[a]===0?2027:2026,MO[a],+b);const e2=p[1].split(" ");const em=e2.length>1?e2[0]:a,ed=+e2[e2.length-1];return[s,new Date(MO[em]===0?2027:2026,MO[em],ed,23,59)]}
function ls(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const data={};const hl=ls("ds_hl",{});
Object.keys(SNAP).forEach(k=>data[+k.slice(1)-1]=SNAP[k]);
const cache=ls("ds_cache",{});Object.keys(cache).forEach(k=>{data[k]=cache[k]});
function status(w){const now=new Date();const[s,e]=rng(W[w][0]);if(now>new Date(e.getTime()+6*3600e3))return"past";if(now>=s)return"cur";return"up"}
function render(){const g=document.getElementById("grid");g.innerHTML="";W.forEach(([lbl,teams],i)=>{const st=status(i);const d=data[i]||{};const el=document.createElement("div");el.className="wk"+(st==="cur"?" cur":"");let h=`<h3>Week ${i+1}</h3><div class="tg">`;let tot=0,any=false,proj=0,anyP=false;teams.forEach(t=>{const x=d[t];let v="",s="",cls="";if(x){if(x.bye){v="BYE"}else if(x.state==="pre"){if(x.proj!=null){v="~"+x.proj;proj+=x.proj;anyP=true;s="proj"}else{v="–";s="no line yet"}}else{v=x.score;tot+=x.score;any=true;s=x.state==="in"?x.detail:"Final";cls=x.state==="in"?" live":""}}h+=`<div class="n">${N[t]}</div><div class="s">${v}`+(s?`<div class="st${cls}">${s}</div>`:"")+`</div>`});h+=`</div>`;if(any)h+=`<div class="tot">Total: ${tot}</div>`;else if(anyP)h+=`<div class="tot proj">Projected: ~${proj}</div>`;else if(st!=="up"&&!data[i])h+=`<div class="tot proj">scores coming</div>`;const r=hl[i];if(st==="past"&&r&&(r.high!=null||r.low!=null))h+=`<div class="hl">High <span class="h">${r.high??"–"}</span> · Low <span class="l">${r.low??"–"}</span></div>`;el.innerHTML=h;if(st==="past")press(el,i);g.appendChild(el)})}
function press(el,i){let t;const start=()=>{t=setTimeout(()=>{if(navigator.vibrate)navigator.vibrate(30);ask(i)},550)};const stop=()=>clearTimeout(t);el.addEventListener("touchstart",start,{passive:true});el.addEventListener("touchend",stop);el.addEventListener("touchmove",stop);el.addEventListener("mousedown",start);el.addEventListener("mouseup",stop);el.addEventListener("mouseleave",stop);el.addEventListener("contextmenu",e=>e.preventDefault())}
function dialog(title,val){return new Promise(res=>{const m=document.getElementById("modal"),inp=document.getElementById("minp");document.getElementById("mtitle").textContent=title;inp.value=val??"";m.style.display="flex";setTimeout(()=>inp.focus(),50);const ok=document.getElementById("mok"),cx=document.getElementById("mcx");const done=v=>{m.style.display="none";ok.onclick=cx.onclick=null;res(v)};ok.onclick=()=>done(inp.value===""?null:+inp.value);cx.onclick=()=>done(undefined)})}
async function ask(i){const cur=hl[i]||{};const h=await dialog(`Week ${i+1}: winning HIGH score`,cur.high);const l=await dialog(`Week ${i+1}: winning LOW score`,cur.low);hl[i]={high:h===undefined?cur.high??null:h,low:l===undefined?cur.low??null:l};lsSet("ds_hl",hl);render()}
let fails=0;
async function loadWeek(i){const teams=W[i][1];try{const r=await fetch(`https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?dates=2026&seasontype=2&week=${i+1}`,{cache:"no-store"});if(!r.ok)throw 0;const j=await r.json();if(!(j.events||[]).length)return;const old=data[i]||{};const d={};j.events.forEach(ev=>{const c=ev.competitions[0];const st=c.status.type;const odds=(c.odds||[])[0];c.competitors.forEach(cp=>{const ab=cp.team.abbreviation==="WAS"?"WSH":cp.team.abbreviation;if(!teams.includes(ab))return;let proj=null;if(odds&&odds.overUnder!=null){const ou=+odds.overUnder;const fav=odds.homeTeamOdds?.favorite?"home":odds.awayTeamOdds?.favorite?"away":null;const spr=Math.abs(+odds.spread||0);proj=Math.round((ou+(fav?(fav===cp.homeAway?1:-1)*spr:0))/2)}if(proj==null&&old[ab]&&old[ab].proj!=null)proj=old[ab].proj;d[ab]={score:+cp.score||0,state:st.state,detail:st.shortDetail,proj}})});teams.forEach(t=>{if(!d[t])d[t]={bye:true}});data[i]=d;cache[i]=d;lsSet("ds_cache",cache)}catch(e){fails++}}
function curWeek(){for(let i=0;i<W.length;i++){if(status(i)!=="past")return i}return W.length-1}
async function refreshAll(){fails=0;await Promise.all(W.map((_,i)=>loadWeek(i)));stamp();render()}
async function refreshCur(){fails=0;const c=curWeek();await loadWeek(c);if(c>0&&status(c-1)==="past"&&(data[c-1]&&Object.values(data[c-1]).some(x=>x.state==="in")))await loadWeek(c-1);stamp();render()}
function stamp(){document.getElementById("upd").textContent=fails?"Offline — showing saved scores.":"Live scores updated "+new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})}
(()=>{const t=document.getElementById("ttl");const s=t.textContent;t.textContent="";[...s].forEach((c,k)=>{const e=document.createElement("span");e.textContent=c===" "?" ":c;e.style.animationDelay=`${-k*0.25}s, ${k*0.09}s`;t.appendChild(e)})})();
render();refreshAll();setInterval(refreshCur,60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)refreshCur()});
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
